# Ablation: AFC-global without knowledge distillation (CE only).
residual_base: avgpool
pool_learnable_scale: true
train_mm_projector: false
learning_rate: 2.0e-4
kd_temperature: 2.0
group_by_modality_length: true
return_compressor_attention: true
logging_steps: 20
save_strategy: steps
save_steps: 500
eval_holdout: 500
evaluation_strategy: steps
eval_steps: 500
per_device_eval_batch_size: 1
prediction_loss_only: true
gradient_checkpointing: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 12
compression_mode: global_dct
kd_lambda: 0.0
